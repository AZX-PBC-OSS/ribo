name: Release

# 0.x versioning via Changesets, versioned and tagged but not yet published.
#
# On a push to `main` with pending `.changeset/*.md` entries, the action opens (or updates) a
# "Version Packages" PR that bumps versions and writes changelogs. Merging that PR cuts the
# release: the next run finds no pending changesets and runs the publish script, which here is
# `changeset tag`, so each bumped package gets a `<name>@<version>` git tag and a GitHub release.
# Nothing reaches a registry. To publish, swap the script for `pnpm changeset:publish` once a
# registry and its credentials exist (CONTRIBUTING.md, "Releasing").

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # the version branch, its commits, and the release tags
  pull-requests: write # open/update the version PR

jobs:
  release:
    name: version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5 # keep in sync with the root package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # v2, not v1: Changesets CLI 3 reports the tags it creates through CHANGESETS_OUTPUT, which
      # v2 reads. v1 parses stdout for lines CLI 3 no longer prints, so it would push no tags.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset tag
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
