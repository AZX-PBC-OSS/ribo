name: CI

on:
  push:
  pull_request:

# Supersede in-flight runs for the same ref: only the newest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, format:check, build:packages, resolve, build:app, pkg gates, test # keep in sync with check.sh's stages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so @changesets/git can find the merge-base of HEAD and
          # origin/main for `changeset status --since=origin/main` below. The
          # default fetch-depth of 1 omits origin/main, which makes that step
          # throw "Failed to find where HEAD diverged from origin/main".
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5 # keep in sync with the root package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The `playwright` npm package contains no browser binaries, so this is a
      # separate step and check.sh's `test` stage fails without it (a Chromium
      # launch error, not a missing module). `--with-deps` also installs the
      # Linux shared libraries headless Chromium needs on a bare runner.
      # Chromium only: the browser project targets it exclusively (see
      # docs/implementation/10-build-and-packaging.md §2.1).
      - run: pnpm exec playwright install --with-deps chromium

      - run: ./check.sh

      # `changeset status` is CI-only: it needs a git remote and a base ref to diff
      # against, so it does not belong in a local ./check.sh run. Scoped to pull
      # requests because on a push to `main` the base ref IS the current ref, so
      # there is nothing to diff and the check reports a spurious failure.
      # `origin/main` matches `baseBranch` in .changeset/config.json.
      - if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

      # Caches the persistent Chromium profile the pack-and-consume tier below reuses across runs
      # (scripts/pack-and-consume/index.mjs's "Network dependency" section) — the pinned HF Hub
      # test model's fetched bytes land in that profile's Cache API storage, so a cache hit means
      # THIS step below makes no network call at all beyond `pnpm install`. Keyed on a hash of
      # app-template.mjs, where the pinned revision lives: bumping the pin changes the key, so a
      # cache from an old pin is never restored (no stale-cache confusion), and the bump costs
      # exactly one real cold fetch, not one per run thereafter.
      - uses: actions/cache@v4
        with:
          path: .cache/pack-and-consume/chromium-profile
          key: pack-and-consume-chromium-${{ hashFiles('scripts/pack-and-consume/app-template.mjs') }}

      # R3 (docs/implementation/10-build-and-packaging.md §7/§8, doc's own "mandatory, not
      # optional ... the highest-value test in the repo"): pack the five tarballs, install them
      # into a fresh app OUTSIDE this repo, build it for real, and assert the on-device
      # transcriber's published worker spawns and its ONNX Runtime WASM backend loads. Deliberately
      # its OWN CI step rather than a `./check.sh` stage — see `scripts/pack-and-consume/index.mjs`'s
      # header for why (it packs, installs and builds outside the repo, which is too slow and too
      # side-effecting for the local edit-save-check loop) — but still a step every push runs, not a
      # manual command nobody remembers, because unlike `gate.manual.ts` it needs no secret.
      - run: pnpm test:pack-and-consume
